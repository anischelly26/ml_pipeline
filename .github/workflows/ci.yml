name: Portfolio Fork CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate pipeline source
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q backend spaces

      - name: Verify deployment assets
        shell: bash
        run: |
          test -f backend/main.py
          test -f frontend/index.html
          test -f database/migration.sql
          test -f DEPLOYMENT_GUIDE.md
          echo "Pipeline structure validation passed."
